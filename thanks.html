<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Resistance Restoration & Remodeling</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .bg-image {
            /* The image used */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url("1.jpg");

            /* Full height */
            height: 100%; 

            /* Center and scale the image nicely */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thanks-box {
            text-align: center;
            color: white; /* All text white */
            padding: 40px;
            max-width: 600px;
        }

        .thanks-box i {
            font-size: 60px;
            color: #4CAF50; /* Keep the checkmark green for success */
            margin-bottom: 20px;
        }

        .thanks-box h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .thanks-box p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .back-home {
            display: inline-block;
            background-color: transparent;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border: 2px solid white;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background-color: white;
            color: black;
        }
        
    </style>
</head>
<body>

    <div class="bg-image">
        <div class="thanks-box">
            <i class="fas fa-circle-check"></i>
            <h1>Message Sent</h1>
            <p>Thank you for choosing <strong>Resistance Restoration & Remodeling LLC</strong>.<br>
               One of our experts will contact you shortly to discuss your project.</p>
            
            <a href="index.html" class="back-home">RETURN HOME</a>
        </div>
    </div>

</body>
</html>
